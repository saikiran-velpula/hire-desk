<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hire Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --paper:#FAF9F5; --paper-dim:#F2F0E8; --ink:#20241F; --ink-soft:#5B6058;
    --hairline:#DBD6C9; --hairline-strong:#C6C0B0;
    --hr:#3D4F7D; --hr-tint:#E9ECF4; --panel:#2F6F63; --panel-tint:#E7F1EE;
    --mgr:#B9812E; --mgr-tint:#F7EEDC; --danger:#9A3B34; --danger-tint:#F5E7E5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  input,select,textarea{font-family:inherit;font-size:14px;transition:border-color .15s ease;}
  #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,var(--paper) 0%,var(--paper-dim) 100%);}
  .auth-card{width:100%;max-width:440px;background:#fff;border:1px solid var(--hairline);padding:36px 32px;box-shadow:0 2px 24px rgba(32,36,31,0.06);}
  .auth-brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .auth-brand .mark{width:10px;height:10px;background:var(--ink);display:inline-block;}
  .auth-tag{color:var(--ink-soft);font-size:13px;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--hairline-strong);background:var(--paper);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--ink);}
  .role-pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .role-opt{border:1px solid var(--hairline-strong);padding:10px 6px;text-align:center;font-size:13px;background:var(--paper);}
  .role-opt.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .chk-opt{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--hairline-strong);padding:7px 8px;}
  .chk-opt input{margin:0;}
  .btn-primary{width:100%;background:var(--ink);color:#fff;border:none;padding:12px;font-size:14px;font-weight:600;margin-top:6px;}
  .btn-primary:hover{background:#000;}
  .btn-primary[disabled]{opacity:0.5;cursor:not-allowed;}
  .auth-switch{margin-top:18px;font-size:13px;color:var(--ink-soft);text-align:center;}
  .auth-switch a{color:var(--ink);cursor:pointer;text-decoration:underline;}
  .auth-error{background:var(--danger-tint);color:var(--danger);padding:9px 11px;font-size:13px;margin-bottom:14px;border-left:3px solid var(--danger);}
  .auth-note{font-size:11.5px;color:var(--ink-soft);margin-top:18px;border-top:1px solid var(--hairline);padding-top:14px;}
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .rail{width:224px;flex-shrink:0;border-right:1px solid var(--hairline);padding:24px 0;display:flex;flex-direction:column;background:#fff;}
  .rail-brand{padding:0 22px 20px;border-bottom:1px solid var(--hairline);margin-bottom:8px;}
  .rail-brand .mark{width:9px;height:9px;background:var(--ink);display:inline-block;margin-right:7px;}
  .rail-nav{padding:8px 12px;flex:1;}
  .rail-nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;padding:10px 11px;font-size:14px;color:var(--ink-soft);margin-bottom:2px;border-radius:2px;}
  .rail-nav button .ic{width:15px;text-align:center;flex-shrink:0;opacity:0.75;}
  .rail-nav button.active{background:var(--paper-dim);color:var(--ink);font-weight:600;}
  .rail-nav button.active .ic{opacity:1;}
  .rail-nav button:hover:not(.active){background:var(--paper-dim);}
  .rail-foot{padding:14px 22px;border-top:1px solid var(--hairline);}
  .who{font-size:13px;font-weight:600;}
  .badge{display:inline-block;font-size:10.5px;padding:2px 7px;margin-top:5px;font-weight:600;}
  .badge.hr{background:var(--hr-tint);color:var(--hr);}
  .badge.panel{background:var(--panel-tint);color:var(--panel);}
  .badge.mgr{background:var(--mgr-tint);color:var(--mgr);}
  .logout{margin-top:10px;background:none;border:none;font-size:12.5px;color:var(--ink-soft);text-decoration:underline;padding:0;}
  .mobile-topbar{display:none;}
  .main{flex:1;padding:36px 44px;max-width:1020px;}
  .page-head{margin-bottom:26px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .page-head h1{font-size:26px;}
  .page-head p{color:var(--ink-soft);font-size:13.5px;margin-top:6px;}
  .stat-row{display:flex;border:1px solid var(--hairline);margin-bottom:28px;flex-wrap:wrap;background:#fff;}
  .stat{flex:1;min-width:120px;padding:16px 20px;border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
  .stat:last-child{border-right:none;}
  .stat .n{font-family:'Fraunces',serif;font-size:28px;font-weight:600;}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .panel-box{border:1px solid var(--hairline);background:#fff;margin-bottom:24px;box-shadow:0 1px 2px rgba(32,36,31,0.03);}
  .panel-box-head{padding:14px 18px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;}
  .panel-box-head h3{font-size:15px;}
  .row-item{padding:14px 18px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;transition:background .15s ease;}
  .row-item:hover{background:var(--paper-dim);}
  .row-item:last-child{border-bottom:none;}
  .row-empty{padding:24px 18px;color:var(--ink-soft);font-size:13.5px;font-style:italic;}
  .row-title{font-weight:600;font-size:14px;}
  .row-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .row-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .tag{font-size:10.5px;padding:3px 8px;font-weight:600;white-space:nowrap;border-radius:2px;}
  .tag.pending{background:var(--mgr-tint);color:var(--mgr);}
  .tag.approved{background:var(--panel-tint);color:var(--panel);}
  .tag.rejected{background:var(--danger-tint);color:var(--danger);}
  .tag.closed{background:#EDEDED;color:#555;}
  .tag.scheduled{background:var(--hr-tint);color:var(--hr);}
  .tag.completed{background:#EDEDED;color:#555;}
  .tag.offer_approved{background:var(--panel-tint);color:var(--panel);}
  .tag.offer_rejected{background:var(--danger-tint);color:var(--danger);}
  .chip{display:inline-block;font-size:10.5px;padding:2px 8px;border:1px solid var(--hairline-strong);margin:0 4px 4px 0;color:var(--ink-soft);border-radius:2px;}
  .btn-sm{border:1px solid var(--ink);background:#fff;padding:6px 12px;font-size:12.5px;font-weight:600;border-radius:2px;}
  .btn-sm:hover{background:var(--ink);color:#fff;}
  .btn-sm.solid{background:var(--ink);color:#fff;}
  .btn-sm.solid:hover{background:#000;}
  .btn-sm.ghost{border-color:var(--hairline-strong);color:var(--ink-soft);}
  .btn-sm.danger{border-color:var(--danger);color:var(--danger);}
  .btn-sm.danger:hover{background:var(--danger);color:#fff;}
  .form-grid{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:9px 10px;border:1px solid var(--hairline-strong);background:var(--paper);}
  .form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{outline:none;border-color:var(--ink);}
  .form-grid textarea{min-height:70px;resize:vertical;}
  .form-foot{padding:14px 18px;border-top:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .slot-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline-strong);padding:5px 10px;font-size:12.5px;margin:0 6px 6px 0;border-radius:2px;}
  .slot-chip button{background:none;border:none;color:var(--danger);font-size:14px;line-height:1;padding:0;}
  .mini-label{font-size:11px;color:var(--ink-soft);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;font-size:13.5px;z-index:60;display:none;max-width:80vw;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{color:var(--ink);margin-bottom:6px;font-size:17px;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:14px;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(32,36,31,0.45);align-items:center;justify-content:center;z-index:80;padding:20px;}
  .modal{background:#fff;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;border:1px solid var(--hairline);box-shadow:0 8px 40px rgba(0,0,0,0.2);}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;}
  .modal-head h3{font-size:16px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;}
  .modal-body{padding:0;}
  .timeline-item{padding:12px 20px;border-bottom:1px solid var(--hairline);font-size:13px;}
  .timeline-item:last-child{border-bottom:none;}
  .timeline-item .t-when{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  select[multiple]{height:auto;}
  @media (max-width:760px){
    .shell{flex-direction:column;}
    .rail{display:none;}
    .mobile-topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--hairline);background:#fff;position:sticky;top:0;z-index:40;}
    .mobile-topbar .mt-who{font-size:13px;}
    .mobile-topbar .mt-who strong{display:block;font-size:14px;}
    .mobile-nav{display:flex;overflow-x:auto;gap:4px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--hairline);position:sticky;top:57px;z-index:39;}
    .mobile-nav button{flex-shrink:0;background:var(--paper-dim);border:none;padding:8px 13px;font-size:13px;color:var(--ink-soft);white-space:nowrap;}
    .mobile-nav button.active{background:var(--ink);color:#fff;font-weight:600;}
    .main{padding:22px 18px;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">Loading Hire Desk…</div>

<div id="auth-screen" style="display:none;">
  <div class="auth-card">
    <div class="auth-brand"><span class="mark"></span><h1 style="font-size:20px;">Hire Desk</h1></div>
    <div class="auth-tag" id="auth-tag">Sign in to your workspace</div>
    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <div id="signin-form">
      <div class="field"><label>Email</label><input type="email" id="si-email" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input type="password" id="si-pass"></div>
      <button class="btn-primary" id="si-btn" onclick="doSignIn()">Sign in</button>
      <div class="auth-switch">New here? <a onclick="toggleAuth('signup')">Create an account</a></div>
    </div>

    <div id="signup-form" style="display:none;">
      <div class="field"><label>Full name</label><input type="text" id="su-name" placeholder="Jane Doe"></div>
      <div class="field"><label>Company email</label><input type="email" id="su-email" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input type="password" id="su-pass" placeholder="At least 6 characters"></div>
      <div class="field">
        <label>You are a</label>
        <div class="role-pick">
          <div class="role-opt active" data-role="hr" onclick="pickRole('hr')">HR</div>
          <div class="role-opt" data-role="panel" onclick="pickRole('panel')">Panel</div>
          <div class="role-opt" data-role="manager" onclick="pickRole('manager')">Manager</div>
        </div>
      </div>
      <div class="field"><label>Department</label><select id="su-dept"></select></div>
      <div class="field" id="techstack-field" style="display:none;">
        <label>Your tech stack(s)</label>
        <div class="chk-grid" id="techstack-checks"></div>
      </div>
      <button class="btn-primary" id="su-btn" onclick="doSignUp()">Create account</button>
      <div class="auth-switch">Already have an account? <a onclick="toggleAuth('signin')">Sign in</a></div>
    </div>
    <div class="auth-note">Your manager will be assigned by HR after you sign up — you'll see it reflected under Team once set.</div>
  </div>
</div>

<div id="app-screen">
  <div class="mobile-topbar">
    <div class="mt-who"><strong id="mt-name"></strong><span class="badge" id="mt-badge"></span></div>
    <button class="logout" onclick="doSignOut()">Sign out</button>
  </div>
  <div class="mobile-nav" id="mobile-nav"></div>
  <div class="shell">
    <div class="rail">
      <div class="rail-brand"><span class="mark"></span><strong>Hire Desk</strong></div>
      <div class="rail-nav" id="rail-nav"></div>
      <div class="rail-foot">
        <div class="who" id="who-name"></div>
        <span class="badge" id="who-badge"></span><br>
        <button class="logout" onclick="doSignOut()">Sign out</button>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal-bg"><div class="modal">
  <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body" id="modal-body"></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, getDocs, addDoc, updateDoc,
  collection, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWKNup0MyiFJPhi_3uy3QY2VVhWgYPLy0",
  authDomain: "hire-desk-f9c44.firebaseapp.com",
  projectId: "hire-desk-f9c44",
  storageBucket: "hire-desk-f9c44.firebasestorage.app",
  messagingSenderId: "123809044017",
  appId: "1:123809044017:web:92318f793d8a134a43a710"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const secondaryApp = initializeApp(firebaseConfig, 'Secondary'); // used only for creating other users' accounts
const secondaryAuth = getAuth(secondaryApp);

const ALLOWED_DOMAIN = null; // set to e.g. "acmecorp.com" to restrict sign-up later

/* ---- Fill these in once EmailJS is set up. Until then, emails just log quietly. ---- */
const EMAILJS_SERVICE_ID = 'service_lrdsms7';
const EMAILJS_TEMPLATE_ID = 'template_8kf6gi9';
const EMAILJS_PUBLIC_KEY = 'EP-NpCfAka0joXE4y';
let emailjsReady = false;
if (EMAILJS_PUBLIC_KEY && window.emailjs) { window.emailjs.init(EMAILJS_PUBLIC_KEY); emailjsReady = true; }
async function sendNotification(toEmail, toName, subject, message){
  if(!toEmail) return;
  if(!emailjsReady){ console.log('[Email not sent — EmailJS not configured yet]', {toEmail, subject, message}); return; }
  try{
    await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: toEmail, to_name: toName || '', subject, message, app_link: window.location.href
    });
  }catch(e){ console.error('Email send failed', e); }
}

let TECH_STACKS = ['Salesforce','SAP','Java','DevOps','QA Functional','QA Automation','React JS'];
let DEPARTMENTS = ['Engineering','Sales','Marketing','Human Resources','Finance','Operations'];

async function loadConfigPublic(){
  try{
    const snap = await getDoc(doc(db,'config','techstacks'));
    if(snap.exists() && Array.isArray(snap.data().list) && snap.data().list.length) TECH_STACKS = snap.data().list;
  }catch(e){}
  try{
    const snap2 = await getDoc(doc(db,'config','departments'));
    if(snap2.exists() && Array.isArray(snap2.data().list) && snap2.data().list.length) DEPARTMENTS = snap2.data().list;
  }catch(e){}
  renderTechstackChecks();
  renderDeptSelect();
}
function renderTechstackChecks(){
  document.getElementById('techstack-checks').innerHTML = TECH_STACKS.map(t=>`
    <label class="chk-opt"><input type="checkbox" value="${t}" class="ts-check"> ${t}</label>`).join('');
}
function renderDeptSelect(){
  const el = document.getElementById('su-dept');
  if(el) el.innerHTML = DEPARTMENTS.map(d=>`<option>${d}</option>`).join('');
}
loadConfigPublic();

let session = null;
let signupRole = 'hr';
let allUsers = [], allJobs = [], allAvailability = [], allInterviews = [];
let draftDates = []; // building a job's available-dates list before submit

/* ============================================================
   UTIL
   ============================================================ */
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2800); }
function userByUid(uid){ return allUsers.find(u=>u.uid===uid); }
function historyEntry(event){ return { event, byUid: session.uid, byName: session.name, at: new Date().toISOString() }; }
function fmtWhen(iso){ try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; } }
window.closeModal = function(){ document.getElementById('modal-bg').style.display='none'; };
function openModal(title, bodyHtml){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-bg').style.display = 'flex';
}
window.viewTimeline = function(jobId){
  const job = allJobs.find(j=>j.id===jobId);
  const hist = (job.history||[]).slice().reverse();
  openModal('Job timeline — ' + job.title, hist.length ? hist.map(h=>`
    <div class="timeline-item"><div>${esc(h.event)}</div><div class="t-when">${esc(h.byName)} · ${fmtWhen(h.at)}</div></div>
  `).join('') : `<div class="row-empty">No history yet.</div>`);
};

/* ============================================================
   AUTH
   ============================================================ */
window.pickRole = function(r){
  signupRole = r;
  document.querySelectorAll('.role-opt').forEach(el=>el.classList.toggle('active', el.dataset.role===r));
  document.getElementById('techstack-field').style.display = r==='panel' ? 'block' : 'none';
};
window.toggleAuth = function(which){
  document.getElementById('auth-error').style.display='none';
  document.getElementById('signin-form').style.display = which==='signin' ? 'block':'none';
  document.getElementById('signup-form').style.display = which==='signup' ? 'block':'none';
  document.getElementById('auth-tag').textContent = which==='signin' ? 'Sign in to your workspace' : 'Set up your workspace account';
};
function authFail(msg){ const e=document.getElementById('auth-error'); e.textContent=msg; e.style.display='block'; }
function friendlyAuthError(err){
  const code = err.code || '';
  if(code.includes('email-already-in-use')) return 'An account with this email already exists.';
  if(code.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(code.includes('invalid-email')) return 'Enter a valid email address.';
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Email or password is incorrect.';
  return err.message || 'Something went wrong.';
}

window.doSignUp = async function(){
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim().toLowerCase();
  const pass = document.getElementById('su-pass').value;
  if(!name || !email || !pass) return authFail('Fill in all fields.');
  if(ALLOWED_DOMAIN && !email.endsWith('@'+ALLOWED_DOMAIN)) return authFail(`Use your @${ALLOWED_DOMAIN} email.`);
  const techStacks = signupRole==='panel' ? Array.from(document.querySelectorAll('.ts-check:checked')).map(c=>c.value) : [];
  if(signupRole==='panel' && !techStacks.length) return authFail('Select at least one tech stack.');
  const department = document.getElementById('su-dept').value;
  const btn = document.getElementById('su-btn'); btn.disabled=true; btn.textContent='Creating...';
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db,'users',cred.user.uid), { name, email, role:signupRole, managerUid:null, techStacks, department });
  }catch(err){ authFail(friendlyAuthError(err)); }
  btn.disabled=false; btn.textContent='Create account';
};
window.doSignIn = async function(){
  const email = document.getElementById('si-email').value.trim().toLowerCase();
  const pass = document.getElementById('si-pass').value;
  if(!email || !pass) return authFail('Enter your email and password.');
  const btn = document.getElementById('si-btn'); btn.disabled=true; btn.textContent='Signing in...';
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(err){ authFail(friendlyAuthError(err)); }
  btn.disabled=false; btn.textContent='Sign in';
};
window.doSignOut = async function(){ await signOut(auth); };

onAuthStateChanged(auth, async (user) => {
  document.getElementById('loading-screen').style.display = 'none';
  if(user){
    const snap = await getDoc(doc(db,'users',user.uid));
    if(snap.exists()){
      const u = snap.data();
      session = { uid:user.uid, email:u.email, name:u.name, role:u.role, managerUid:u.managerUid||null, techStacks:u.techStacks||[], department:u.department||'' };
      document.getElementById('auth-screen').style.display='none';
      document.getElementById('app-screen').style.display='block';
      await enterApp();
    } else { await signOut(auth); }
  } else {
    session = null;
    document.getElementById('app-screen').style.display='none';
    document.getElementById('auth-screen').style.display='flex';
  }
});

/* ============================================================
   DATA LOAD
   ============================================================ */
async function loadAll(){
  const [usersSnap, jobsSnap, availSnap, intSnap] = await Promise.all([
    getDocs(collection(db,'users')), getDocs(collection(db,'jobs')),
    getDocs(collection(db,'availability')), getDocs(collection(db,'interviews')),
  ]);
  try{
    const tsSnap = await getDoc(doc(db,'config','techstacks'));
    if(tsSnap.exists() && Array.isArray(tsSnap.data().list) && tsSnap.data().list.length) TECH_STACKS = tsSnap.data().list;
  }catch(e){ /* keep current TECH_STACKS on failure */ }
  try{
    const dSnap = await getDoc(doc(db,'config','departments'));
    if(dSnap.exists() && Array.isArray(dSnap.data().list) && dSnap.data().list.length) DEPARTMENTS = dSnap.data().list;
  }catch(e){ /* keep current DEPARTMENTS on failure */ }
  allUsers = usersSnap.docs.map(d=>({uid:d.id, ...d.data()}));
  allJobs = jobsSnap.docs.map(d=>({id:d.id, ...d.data()}));
  allAvailability = availSnap.docs.map(d=>({id:d.id, ...d.data()})).filter(a=>!a.removed);
  allInterviews = intSnap.docs.map(d=>({id:d.id, ...d.data()}));
  // keep session's own live copy in sync (e.g. manager assignment changes)
  const me = allUsers.find(u=>u.uid===session.uid);
  if(me){ session.managerUid = me.managerUid||null; session.techStacks = me.techStacks||[]; session.department = me.department||''; session.name = me.name; }
}

const NAV = {
  hr:      [['jobs','Job posts'],['availability','Panel availability'],['schedule','Schedule interview'],['interviews','Interviews'],['team','Team & managers'],['addmember','Add team member'],['profile','My profile']],
  panel:   [['openjobs','Open roles'],['myavail','My availability'],['myinterviews','My interviews'],['feedback','Give feedback'],['profile','My profile']],
  manager: [['approvals','Job approvals'],['offers','Offer approvals'],['reports','Reports'],['addmember','Add team member'],['profile','My profile']]
};
const NAV_ICONS = {
  jobs:'&#128188;', availability:'&#128197;', schedule:'&#128198;', interviews:'&#128172;', team:'&#128101;',
  addmember:'&#10133;', profile:'&#9881;', openjobs:'&#128269;', myavail:'&#128197;', myinterviews:'&#128172;',
  feedback:'&#128221;', approvals:'&#9989;', offers:'&#127942;', reports:'&#128202;'
};
window.route = async function(key){
  document.querySelectorAll('.rail-nav button, .mobile-nav button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  await loadAll();
  const r = {
    jobs:renderHRJobs, availability:renderHRAvailability, schedule:renderHRSchedule, interviews:renderHRInterviews, team:renderHRTeam,
    openjobs:renderPanelOpenJobs, myavail:renderPanelMyAvail, myinterviews:renderPanelInterviews, feedback:renderPanelFeedback,
    approvals:renderMgrApprovals, offers:renderMgrOffers, reports:renderMgrReports,
    addmember:renderAddMember, profile:renderProfile
  };
  r[key]();
};
async function enterApp(){
  document.getElementById('who-name').textContent = session.name;
  document.getElementById('mt-name').textContent = session.name;
  const roleLabel = session.role==='hr'?'HR':session.role==='panel'?'Panel Member':'Manager';
  const roleClass = session.role==='hr'?'hr':session.role==='panel'?'panel':'mgr';
  const b = document.getElementById('who-badge'); b.textContent = roleLabel; b.className = 'badge ' + roleClass;
  const mb = document.getElementById('mt-badge'); mb.textContent = roleLabel; mb.className = 'badge ' + roleClass;
  const nav = document.getElementById('rail-nav'); nav.innerHTML='';
  const mnav = document.getElementById('mobile-nav'); mnav.innerHTML='';
  NAV[session.role].forEach(([key,label])=>{
    const btn=document.createElement('button'); btn.dataset.key=key;
    btn.innerHTML = `<span class="ic">${NAV_ICONS[key]||''}</span>${label}`;
    btn.onclick=()=>window.route(key); nav.appendChild(btn);
    const mbtn=document.createElement('button'); mbtn.textContent=label; mbtn.dataset.key=key;
    mbtn.onclick=()=>window.route(key); mnav.appendChild(mbtn);
  });
  await window.route(NAV[session.role][0][0]);
}
function pageHead(t,s){ return `<div class="page-head"><h1>${t}</h1><p>${s}</p></div>`; }
function tagFor(status){
  const labels = {pending:'Pending approval',approved:'Open',rejected:'Rejected',closed:'Closed',
    scheduled:'Scheduled',completed:'Awaiting decision',offer_approved:'Offer approved',offer_rejected:'Offer declined'};
  return `<span class="tag ${status}">${labels[status]||status}</span>`;
}

window.addDraftDate = function(){
  const v = document.getElementById('jf-newdate').value;
  if(!v) return;
  if(!draftDates.includes(v)) draftDates.push(v);
  draftDates.sort();
  renderDraftDates();
};
window.removeDraftDate = function(d){ draftDates = draftDates.filter(x=>x!==d); renderDraftDates(); };
function renderDraftDates(){
  const el = document.getElementById('draft-dates');
  if(!el) return;
  el.innerHTML = draftDates.length ? draftDates.map(d=>`<span class="slot-chip">${d} <button onclick="removeDraftDate('${d}')">✕</button></span>`).join('')
    : `<span class="mini-label">No dates added yet.</span>`;
}
function renderJobRows(jobs, withTimeline){
  if(!jobs.length) return `<div class="row-empty">No job posts yet.</div>`;
  return jobs.slice().reverse().map(j=>{
    const mgr = userByUid(j.approverManagerUid);
    return `<div class="row-item">
      <div>
        <div class="row-title">${esc(j.title)} <span style="font-weight:400;color:var(--ink-soft);">— ${esc(j.department)}</span></div>
        <div class="row-sub">${esc(j.description||'')}</div>
        <div class="row-sub">Tech: <span class="chip">${esc(j.techStack||'—')}</span> Approver: ${mgr?esc(mgr.name):'—'} ${j.availableDates&&j.availableDates.length?`· Dates: ${j.availableDates.join(', ')}`:''}</div>
      </div>
      <div class="row-actions">
        ${tagFor(j.status)}
        ${withTimeline?`<button class="btn-sm ghost" onclick="viewTimeline('${j.id}')">Timeline</button>`:''}
        ${withTimeline && j.status==='approved' ? `<button class="btn-sm danger" onclick="closeJob('${j.id}')">Close job</button>`:''}
      </div>
    </div>`;
  }).join('');
}
window.createJob = async function(){
  const title = document.getElementById('jf-title').value.trim();
  const dept = document.getElementById('jf-dept').value.trim();
  const desc = document.getElementById('jf-desc').value.trim();
  const tech = document.getElementById('jf-tech').value;
  const mgrUid = document.getElementById('jf-mgr').value;
  if(!title || !dept || !mgrUid) return showToast('Fill in title, department and pick an approver.');
  if(!draftDates.length) return showToast('Add at least one available date.');
  const mgr = userByUid(mgrUid);
  const ref = await addDoc(collection(db,'jobs'), {
    title, department:dept, description:desc, techStack:tech,
    availableDates: draftDates.slice(),
    status:'pending', createdBy:session.uid, createdByName:session.name, createdByEmail:session.email,
    approverManagerUid: mgrUid, approverManagerName: mgr.name, approverManagerEmail: mgr.email,
    history: [historyEntry('Job post created')]
  });
  await sendNotification(mgr.email, mgr.name, `Job post awaiting your approval: ${title}`,
    `${session.name} created a job post for ${title} (${dept}) and routed it to you for approval.\n\nReview it in Hire Desk.`);
  showToast('Sent for manager approval.'); window.route('jobs');
};
window.closeJob = async function(jobId){
  await updateDoc(doc(db,'jobs',jobId), { status:'closed', history: arrayUnion(historyEntry('Job closed')) });
  showToast('Job closed.'); window.route('jobs');
};

window.refreshSlotOptions = function(){
  const jobId = document.getElementById('sf-job').value;
  const sel = document.getElementById('sf-slot');
  const slots = allAvailability.filter(a=>a.jobId===jobId && !a.booked);
  sel.innerHTML = slots.length ? slots.map(s=>`<option value="${s.id}">${esc(userByUid(s.panelUid)?.name||'—')} — ${s.date} · ${s.time}</option>`).join('')
    : `<option value="">No slots available for this role</option>`;
};
window.scheduleInterview = async function(){
  const cand = document.getElementById('sf-cand').value.trim();
  const candEmail = document.getElementById('sf-candemail').value.trim();
  const jobId = document.getElementById('sf-job').value;
  const slotId = document.getElementById('sf-slot').value;
  if(!cand || !jobId || !slotId) return showToast('Fill in candidate, role and a slot.');
  const slot = allAvailability.find(a=>a.id===slotId);
  if(!slot || slot.booked) return showToast('That slot is no longer available.');
  const job = allJobs.find(j=>j.id===jobId);
  const panel = userByUid(slot.panelUid);
  await updateDoc(doc(db,'availability',slotId), {booked:true});
  await addDoc(collection(db,'interviews'), {
    jobId, candidateName:cand, candidateEmail:candEmail, panelUid:slot.panelUid,
    date:slot.date, time:slot.time, status:'scheduled', feedback:null
  });
  await updateDoc(doc(db,'jobs',jobId), { history: arrayUnion(historyEntry(`Interview scheduled with ${cand} — panel: ${panel?panel.name:''} on ${slot.date} ${slot.time}`)) });
  if(panel){
    await sendNotification(panel.email, panel.name, `Interview scheduled: ${job.title}`,
      `You're on the panel for ${cand} (${job.title}) on ${slot.date} at ${slot.time}.`);
    const panelMgr = panel.managerUid ? userByUid(panel.managerUid) : null;
    if(panelMgr){
      await sendNotification(panelMgr.email, panelMgr.name, `Interview scheduled: ${panel.name} on ${job.title} panel`,
        `${panel.name} is on the interview panel for ${cand} (${job.title}) on ${slot.date} at ${slot.time}.`);
    }
  }
  showToast('Interview scheduled.'); window.route('schedule');
};

window.addDept = async function(){
  const val = document.getElementById('new-dept').value.trim();
  if(!val) return showToast('Type a department name.');
  if(DEPARTMENTS.includes(val)) return showToast('That department already exists.');
  DEPARTMENTS = [...DEPARTMENTS, val];
  await setDoc(doc(db,'config','departments'), { list: DEPARTMENTS }, { merge:true });
  showToast('Department added.'); window.route('team');
};
window.removeDept = async function(val){
  DEPARTMENTS = DEPARTMENTS.filter(d=>d!==val);
  await setDoc(doc(db,'config','departments'), { list: DEPARTMENTS }, { merge:true });
  showToast('Department removed.'); window.route('team');
};

function renderPanelOpenJobs(){

  document.getElementById('main').innerHTML = `
    ${pageHead('Open roles','Roles matching your tech stack. Add the times you can interview.')}
    ${jobs.length ? jobs.map(j=>{
      const mySlots = allAvailability.filter(a=>a.jobId===j.id && a.panelUid===session.uid);
      return `<div class="panel-box">
        <div class="panel-box-head"><h3>${esc(j.title)}</h3><span class="mini-label">${esc(j.department)} · ${esc(j.techStack)}</span></div>
        <div style="padding:16px 18px;">
          <div class="row-sub" style="margin-bottom:12px;">${esc(j.description||'')}</div>
          <div style="margin-bottom:12px;">${mySlots.map(s=>`<span class="slot-chip">${s.date} · ${s.time} ${s.booked?'(booked)':''} ${!s.booked?`<button onclick="removeSlot('${s.id}')">✕</button>`:''}</span>`).join('') || '<span class="mini-label">No slots added yet.</span>'}</div>
          <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
            <div><label class="mini-label">Date</label><br>
              <select id="av-date-${j.id}">${(j.availableDates||[]).map(d=>`<option value="${d}">${d}</option>`).join('') || '<option value="">No dates set</option>'}</select>
            </div>
            <div><label class="mini-label">Time</label><br><input type="time" id="av-time-${j.id}" style="padding:8px;border:1px solid var(--hairline-strong);"></div>
            <button class="btn-sm" onclick="addSlot('${j.id}')">Add slot</button>
          </div>
        </div>
      </div>`;
    }).join('') : `<div class="empty-state"><h3>No open roles for your tech stack right now</h3>Check back once HR posts a role matching your skills.</div>`}
  `;
}
window.addSlot = async function(jobId){
  const date = document.getElementById(`av-date-${jobId}`).value;
  const time = document.getElementById(`av-time-${jobId}`).value;
  if(!date || !time) return showToast('Pick a date and time.');
  await addDoc(collection(db,'availability'), {jobId, panelUid:session.uid, date, time, booked:false});
  const job = allJobs.find(j=>j.id===jobId);
  await updateDoc(doc(db,'jobs',jobId), { history: arrayUnion(historyEntry(`${session.name} added availability: ${date} ${time}`)) });
  if(job && job.createdByEmail){
    await sendNotification(job.createdByEmail, job.createdByName, `New availability: ${job.title}`,
      `${session.name} added a slot for ${job.title}: ${date} at ${time}. Go to Hire Desk to schedule.`);
  }
  showToast('Availability added.'); window.route('openjobs');
};
window.removeSlot = async function(slotId){
  await updateDoc(doc(db,'availability',slotId), {removed:true});
  allAvailability = allAvailability.filter(s=>s.id!==slotId);
  showToast('Slot removed.');
  const h1 = document.querySelector('.page-head h1');
  if(h1 && h1.textContent.includes('My availability')) renderPanelMyAvail(); else renderPanelOpenJobs();
};

function renderPanelMyAvail(){
  const mine = allAvailability.filter(a=>a.panelUid===session.uid);
  document.getElementById('main').innerHTML = `
    ${pageHead('My availability','Every slot you\u2019ve offered, across all roles.')}
    <div class="panel-box"><div>${
      mine.length ? mine.map(s=>{
        const job = allJobs.find(j=>j.id===s.jobId);
        return `<div class="row-item"><div><div class="row-title">${job?esc(job.title):'—'}</div><div class="row-sub">${s.date} · ${s.time}</div></div>
          ${s.booked?`<span class="tag scheduled">Booked</span>`:`<button class="btn-sm ghost" onclick="removeSlot('${s.id}')">Remove</button>`}</div>`;
      }).join('') : `<div class="row-empty">You haven't added any availability yet.</div>`
    }</div></div>`;
}
function renderPanelInterviews(){
  const mine = allInterviews.filter(i=>i.panelUid===session.uid);
  document.getElementById('main').innerHTML = `
    ${pageHead('My interviews','Interviews you\u2019re on the panel for.')}
    <div class="panel-box"><div>${
      mine.length ? mine.slice().reverse().map(i=>{
        const job = allJobs.find(j=>j.id===i.jobId);
        return `<div class="row-item"><div><div class="row-title">${esc(i.candidateName)} — ${job?esc(job.title):'—'}</div><div class="row-sub">${i.date} · ${i.time}</div></div>${tagFor(i.status)}</div>`;
      }).join('') : `<div class="row-empty">No interviews scheduled yet.</div>`
    }</div></div>`;
}
function renderPanelFeedback(){
  const pending = allInterviews.filter(i=>i.panelUid===session.uid && i.status==='scheduled');
  document.getElementById('main').innerHTML = `
    ${pageHead('Give feedback','Interviews awaiting your write-up.')}
    <div class="panel-box"><div>${
      pending.length ? pending.map(i=>{
        const job = allJobs.find(j=>j.id===i.jobId);
        return `<div class="row-item" style="display:block;">
          <div class="row-title" style="margin-bottom:10px;">${esc(i.candidateName)} — ${job?esc(job.title):'—'}</div>
          <div class="form-grid" style="padding:0;">
            <div class="full"><label>Recommendation</label><select id="fb-rec-${i.id}"><option value="yes">Recommend hire</option><option value="no">Do not recommend</option></select></div>
            <div class="full"><label>Comments</label><textarea id="fb-com-${i.id}" placeholder="Notes on the interview..."></textarea></div>
          </div>
          <div style="margin-top:10px;"><button class="btn-sm solid" onclick="submitFeedback('${i.id}')">Submit feedback</button></div>
        </div>`;
      }).join('') : `<div class="row-empty">Nothing waiting on you right now.</div>`
    }</div></div>`;
}
window.submitFeedback = async function(interviewId){
  const recommend = document.getElementById(`fb-rec-${interviewId}`).value;
  const comments = document.getElementById(`fb-com-${interviewId}`).value.trim();
  const i = allInterviews.find(x=>x.id===interviewId);
  await updateDoc(doc(db,'interviews',interviewId), { feedback:{recommend,comments,by:session.uid}, status:'completed' });
  if(i){ await updateDoc(doc(db,'jobs',i.jobId), { history: arrayUnion(historyEntry(`${session.name} submitted feedback for ${i.candidateName}`)) }); }
  showToast('Feedback submitted.'); window.route('feedback');
};

/* ============================================================
   MANAGER VIEWS
   ============================================================ */
function renderMgrApprovals(){
  const pending = allJobs.filter(j=>j.status==='pending' && j.approverManagerUid===session.uid);
  document.getElementById('main').innerHTML = `
    ${pageHead('Job approvals','Requisitions routed to you specifically.')}
    <div class="panel-box"><div>${
      pending.length ? pending.map(j=>`
        <div class="row-item">
          <div><div class="row-title">${esc(j.title)} — ${esc(j.department)}</div><div class="row-sub">${esc(j.description||'')}</div>
          <div class="row-sub">From ${esc(j.createdByName)} · Tech: ${esc(j.techStack)}</div></div>
          <div class="row-actions">
            <button class="btn-sm solid" onclick="decideJob('${j.id}','approved')">Approve</button>
            <button class="btn-sm danger" onclick="decideJob('${j.id}','rejected')">Reject</button>
          </div>
        </div>`).join('') : `<div class="row-empty">No job posts waiting on you.</div>`
    }</div></div>`;
}
window.decideJob = async function(jobId, decision){
  const job = allJobs.find(j=>j.id===jobId);
  await updateDoc(doc(db,'jobs',jobId), { status:decision, history: arrayUnion(historyEntry(`Manager ${decision} the job post`)) });
  if(decision==='approved'){
    const matchingPanel = allUsers.filter(u=>u.role==='panel' && (u.techStacks||[]).includes(job.techStack));
    for(const p of matchingPanel){
      await sendNotification(p.email, p.name, `New role open: ${job.title}`,
        `A ${job.techStack} role (${job.title}) is open. Please add your available interview slots on: ${(job.availableDates||[]).join(', ')}.`);
    }
  }
  showToast(decision==='approved'?'Job post approved.':'Job post rejected.'); window.route('approvals');
};

function renderMgrOffers(){
  const ready = allInterviews.filter(i=>i.status==='completed');
  document.getElementById('main').innerHTML = `
    ${pageHead('Offer approvals','Interviews with feedback, awaiting your final call.')}
    <div class="panel-box"><div>${
      ready.length ? ready.map(i=>{
        const job = allJobs.find(j=>j.id===i.jobId); const p = userByUid(i.panelUid);
        return `<div class="row-item">
          <div><div class="row-title">${esc(i.candidateName)} — ${job?esc(job.title):'—'}</div>
          <div class="row-sub">Panel: ${p?esc(p.name):'—'}</div>
          <div class="row-sub" style="margin-top:8px;padding:10px;background:var(--paper-dim);">${i.feedback.recommend==='yes'?'Recommends hire':'Does not recommend'} — "${esc(i.feedback.comments)}"</div></div>
          <div class="row-actions">
            <button class="btn-sm solid" onclick="decideOffer('${i.id}','offer_approved')">Approve offer</button>
            <button class="btn-sm danger" onclick="decideOffer('${i.id}','offer_rejected')">Decline</button>
          </div>
        </div>`;
      }).join('') : `<div class="row-empty">Nothing awaiting a decision.</div>`
    }</div></div>`;
}
window.decideOffer = async function(interviewId, decision){
  const i = allInterviews.find(x=>x.id===interviewId);
  await updateDoc(doc(db,'interviews',interviewId), {status:decision});
  if(i){ await updateDoc(doc(db,'jobs',i.jobId), { history: arrayUnion(historyEntry(`Manager recorded offer decision: ${decision} for ${i.candidateName}`)) }); }
  showToast('Decision recorded.'); window.route('offers');
};

function renderMgrReports(){
  const jobsCount = allJobs.length, open = allJobs.filter(j=>j.status==='approved').length;
  const interviewsCount = allInterviews.length, hired = allInterviews.filter(i=>i.status==='offer_approved').length;
  document.getElementById('main').innerHTML = `
    ${pageHead('Reports','A read-only view across the whole pipeline.')}
    <div class="stat-row">
      <div class="stat"><div class="n">${jobsCount}</div><div class="l">Job posts</div></div>
      <div class="stat"><div class="n">${open}</div><div class="l">Open roles</div></div>
      <div class="stat"><div class="n">${interviewsCount}</div><div class="l">Interviews</div></div>
      <div class="stat"><div class="n">${hired}</div><div class="l">Offers approved</div></div>
    </div>
    <div class="panel-box"><div class="panel-box-head"><h3>All job posts</h3></div><div>${renderJobRows(allJobs, true)}</div></div>
    <div class="panel-box"><div class="panel-box-head"><h3>All interviews</h3></div><div>${
      allInterviews.length ? allInterviews.slice().reverse().map(i=>{
        const job = allJobs.find(j=>j.id===i.jobId);
        return `<div class="row-item"><div><div class="row-title">${esc(i.candidateName)} — ${job?esc(job.title):'—'}</div><div class="row-sub">${i.date} · ${i.time}</div></div>${tagFor(i.status)}</div>`;
      }).join('') : `<div class="row-empty">No interviews yet.</div>`
    }</div></div>`;
}

/* ============================================================
   MY PROFILE (all roles)
   ============================================================ */
function renderProfile(){
  const mgr = session.managerUid ? userByUid(session.managerUid) : null;
  document.getElementById('main').innerHTML = `
    ${pageHead('My profile','Keep your details up to date.')}
    <div class="panel-box">
      <div class="form-grid">
        <div><label>Full name</label><input id="pf-name" value="${esc(session.name)}"></div>
        <div><label>Email</label><input value="${esc(session.email)}" disabled style="opacity:0.6;"></div>
        <div><label>Role</label><input value="${session.role==='hr'?'HR':session.role==='panel'?'Panel Member':'Manager'}" disabled style="opacity:0.6;"></div>
        <div><label>Department</label><select id="pf-dept">${DEPARTMENTS.map(d=>`<option ${d===session.department?'selected':''}>${esc(d)}</option>`).join('')}</select></div>
        <div class="full"><label>Manager</label><input value="${mgr?esc(mgr.name):'Not yet assigned by HR'}" disabled style="opacity:0.6;"></div>
        ${session.role==='panel' ? `<div class="full"><label>Tech stack(s)</label>
          <div class="chk-grid">${TECH_STACKS.map(t=>`<label class="chk-opt"><input type="checkbox" value="${t}" class="pf-ts" ${session.techStacks.includes(t)?'checked':''}> ${t}</label>`).join('')}</div>
        </div>` : ''}
      </div>
      <div class="form-foot"><span></span><button class="btn-sm solid" onclick="saveProfile()">Save changes</button></div>
    </div>`;
}
window.saveProfile = async function(){
  const name = document.getElementById('pf-name').value.trim();
  const department = document.getElementById('pf-dept').value;
  if(!name) return showToast('Name can\'t be empty.');
  const update = { name, department };
  if(session.role==='panel'){
    const techStacks = Array.from(document.querySelectorAll('.pf-ts:checked')).map(c=>c.value);
    if(!techStacks.length) return showToast('Select at least one tech stack.');
    update.techStacks = techStacks;
  }
  await updateDoc(doc(db,'users',session.uid), update);
  Object.assign(session, update);
  document.getElementById('who-name').textContent = session.name;
  document.getElementById('mt-name').textContent = session.name;
  showToast('Profile updated.'); window.route('profile');
};

/* ============================================================
   ADD TEAM MEMBER (HR & Manager)
   ============================================================ */
let addMemberRole = 'panel';
window.pickAddRole = function(r){
  addMemberRole = r;
  document.querySelectorAll('.am-role-opt').forEach(el=>el.classList.toggle('active', el.dataset.role===r));
  document.getElementById('am-techstack-field').style.display = r==='panel' ? 'block' : 'none';
};
function renderAddMember(){
  addMemberRole = 'panel';
  document.getElementById('main').innerHTML = `
    ${pageHead('Add team member','Create an account directly — share the temporary password with them so they can sign in and set their own later via My Profile.')}
    <div class="panel-box">
      <div class="form-grid">
        <div><label>Full name</label><input id="am-name" placeholder="Jane Doe"></div>
        <div><label>Company email</label><input id="am-email" placeholder="jane@company.com"></div>
        <div><label>Temporary password</label><input id="am-pass" value="${Math.random().toString(36).slice(2,10)}Aa1"></div>
        <div><label>Department</label><select id="am-dept">${DEPARTMENTS.map(d=>`<option>${d}</option>`).join('')}</select></div>
        <div class="full">
          <label>Role</label>
          <div class="role-pick">
            <div class="role-opt am-role-opt" data-role="hr" onclick="pickAddRole('hr')">HR</div>
            <div class="role-opt am-role-opt active" data-role="panel" onclick="pickAddRole('panel')">Panel</div>
            <div class="role-opt am-role-opt" data-role="manager" onclick="pickAddRole('manager')">Manager</div>
          </div>
        </div>
        <div class="full" id="am-techstack-field">
          <label>Tech stack(s)</label>
          <div class="chk-grid">${TECH_STACKS.map(t=>`<label class="chk-opt"><input type="checkbox" value="${t}" class="am-ts"> ${t}</label>`).join('')}</div>
        </div>
      </div>
      <div class="form-foot"><span></span><button class="btn-sm solid" onclick="createMember()">Create account</button></div>
    </div>`;
}
window.createMember = async function(){
  const name = document.getElementById('am-name').value.trim();
  const email = document.getElementById('am-email').value.trim().toLowerCase();
  const pass = document.getElementById('am-pass').value;
  const department = document.getElementById('am-dept').value;
  const techStacks = addMemberRole==='panel' ? Array.from(document.querySelectorAll('.am-ts:checked')).map(c=>c.value) : [];
  if(!name || !email || !pass) return showToast('Fill in name, email and password.');
  if(addMemberRole==='panel' && !techStacks.length) return showToast('Select at least one tech stack.');
  try{
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    await setDoc(doc(db,'users',cred.user.uid), { name, email, role:addMemberRole, managerUid:session.role==='manager'?session.uid:null, techStacks, department });
    await signOut(secondaryAuth);
    showToast(`Account created. Share the password "${pass}" with ${name}.`);
    window.route('addmember');
  }catch(err){ showToast(friendlyAuthError(err)); }
};
